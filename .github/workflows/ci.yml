name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: lint + test / ${{matrix.name}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            dir: services/gateway
          - name: web
            dir: web
    defaults:
      run:
        working-directory: ${{matrix.dir}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
  shipments-service:
      name: lint+test / shipments-service
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: services/shipments-service
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-python@v7
          with:
            python-version: "3.12"
            cache: pip
            cache-dependency-path: services/shipments-service/pyproject.toml

        - run: pip install -e ".[dev]"
        - run: ruff check .
        - run: pytest
  tracking-service:
      name: lint+test / tracking-service
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: services/tracking-service
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-go@v5
          with:
            go-version: "1.22"
            cache-dependency-path: services/tracking-service/go.sum

        - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
        - run: go vet ./...

        - uses: golangci/golangci-lint-action@v6
          with:
            working-directory: services/tracking-service
            version: latest

        - run: go test ./...
  build-and-publish:
      name: build+scan / ${{ matrix.service }}
      needs: [node, shipments-service, tracking-service]
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          include:
            - service: gateway
              context: services/gateway
            - service: web
              context: web
            - service: shipments-service
              context: services/shipments-service
            - service: tracking-service
              context: services/tracking-service
      steps:
        - uses: actions/checkout@v4

        - uses: docker/setup-buildx-action@v3

        - name: Build image (local, not pushed yet)
          uses: docker/build-push-action@v6
          with:
            context: ${{ matrix.context }}
            load: true
            push: false
            tags: local/${{ matrix.service }}:${{ github.sha }}
            cache-from: type=gha,scope=${{ matrix.service }}
            cache-to: type=gha,mode=max,scope=${{ matrix.service }}

        # - name: Scan image for vulnerabilities (gate)
        #   uses: aquasecurity/trivy-action@v0.36.0
        #   with:
        #     image-ref: local/${{ matrix.service }}:${{ github.sha }}
        #     format: table
        #     severity: CRITICAL,HIGH
        #     ignore-unfixed: true
        #     exit-code: "1"

        - name: Log in to GHCR
          if: github.event_name == 'push'
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Tag and push
          if: github.event_name == 'push'
          run: |
            image="${REGISTRY}/${{ github.repository_owner }}/${{ matrix.service }}"
            image="${image,,}" # GHCR requires lowercase repository names
            docker tag "local/${{ matrix.service }}:${{ github.sha }}" "${image}:${{ github.sha }}"
            docker push "${image}:${{ github.sha }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              docker tag "local/${{ matrix.service }}:${{ github.sha }}" "${image}:latest"
              docker push "${image}:latest"
            fi
  bump-image-tags:
      name: gitops / bump image tags
      needs: [build-and-publish]
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      permissions:
        contents: write # push the values.yaml changes back to main
      env:
        SHA: ${{ github.sha }}
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0 # full history, to diff against the currently deployed commit

        # Git is the source of truth: point each chart at the image just pushed,
        # Argo CD notices the commit and rolls out only that service.
        # A service is bumped only if its source changed since the commit its
        # tag points at now (or the tag isn't a commit yet, e.g. `latest`), so
        # an unrelated push doesn't restart it — and a cancelled run is caught up
        # by the next one.
        - name: Set image tags of changed services to this commit
          run: |
            declare -A src=(
              [gateway]=services/gateway
              [web]=web
              [shipments-service]=services/shipments-service
              [tracking-service]=services/tracking-service
            )
            for svc in "${!src[@]}"; do
              values="helm/charts/${svc}/values.yaml"
              current=$(yq '.image.tag' "$values")
              if git cat-file -e "${current}^{commit}" 2>/dev/null \
                && git diff --quiet "$current" "$SHA" -- "${src[$svc]}"; then
                echo "${svc}: unchanged since ${current::7}"
                continue
              fi
              yq -i '.image.tag = strenv(SHA)' "$values"
              echo "${svc}: -> ${SHA::7}"
            done
            git diff

        # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
        - name: Commit and push
          run: |
            git diff --quiet && exit 0
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "deploy: bump image tags to ${SHA::7} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
