# ParcelPigeon: one Argo CD Application per chart under helm/charts/.
# Each service gets its own sync status, history and rollback; adding a
# service = adding a chart folder, no Argo CD change needed.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: parcelpigeon
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # One Application per folder in helm/charts/ on main.
    - git:
        repoURL: https://github.com/Chnu-devops/parcel-pigeon.git
        revision: main
        directories:
          - path: helm/charts/*
  template:
    metadata:
      name: "parcelpigeon-{{ .path.basename }}"
      finalizers:
        # Deleting an Application also deletes what it deployed
        # (PVCs survive thanks to their `Delete=false` sync option).
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/Chnu-devops/parcel-pigeon.git
        targetRevision: main
        path: "{{ .path.path }}"
        helm:
          releaseName: "{{ .path.basename }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: parcelpigeon # all charts share one namespace, so DNS names like `postgres` keep working
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
