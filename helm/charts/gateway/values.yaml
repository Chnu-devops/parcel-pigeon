# Default values for the gateway chart.

image:
  repository: ghcr.io/chnu-devops/gateway
  tag: latest
replicas: 1
port: 8000
config:
  PORT: "8000"
  HOST: "0.0.0.0"
  SHIPMENTS_URL: "http://shipments-service:8000"
  TRACKING_URL: "http://tracking-service:8002"
  LOG_LEVEL: "info"
secret:
  GATEWAY_API_KEY: ""
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
