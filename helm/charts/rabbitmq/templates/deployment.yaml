apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    {{- include "parcelpigeon.labels" (dict "name" "rabbitmq" "ctx" $) | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "parcelpigeon.selectorLabels" "rabbitmq" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "parcelpigeon.labels" (dict "name" "rabbitmq" "ctx" $) | nindent 8 }}
    spec:
      containers:
        - name: rabbitmq
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.ports.amqp }}
            - containerPort: {{ .Values.ports.management }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          # Boot takes ~50s under the 250m CPU limit; give it up to 3 min
          # before liveness is allowed to restart the pod.
          startupProbe:
            tcpSocket:
              port: {{ .Values.ports.amqp }}
            periodSeconds: 5
            failureThreshold: 36
          # rabbitmq-diagnostics boots an Erlang VM per call and blows the
          # default 1s probe timeout, so give it room.
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
