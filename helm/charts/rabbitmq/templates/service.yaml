apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    {{- include "parcelpigeon.labels" (dict "name" "rabbitmq" "ctx" $) | nindent 4 }}
spec:
  selector:
    {{- include "parcelpigeon.selectorLabels" "rabbitmq" | nindent 4 }}
  ports:
    {{- range $name, $port := .Values.ports }}
    - name: {{ $name }}
      port: {{ $port }}
      targetPort: {{ $port }}
    {{- end }}
