apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  labels:
    {{- include "parcelpigeon.labels" (dict "name" "rabbitmq" "ctx" $) | nindent 4 }}
  annotations:
    # Keep the data volume on `helm uninstall`.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.rabbitmq.persistence.size }}
