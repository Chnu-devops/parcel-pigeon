# Default values for the parcelpigeon chart.
# Every value here matches what the raw manifests on the add-k8s branch hardcoded.

ingress:
  enabled: true
  className: nginx
  host: parcelpigeon.local

# --- Datastores -------------------------------------------------------------

postgres:
  image:
    repository: postgres
    tag: 16-alpine
  replicas: 1
  port: 5432
  persistence:
    size: 1Gi
  secret:
    POSTGRES_USER: parcelpigeon
    POSTGRES_PASSWORD: parcelpigeon
    POSTGRES_DB: shipments
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

redis:
  image:
    repository: redis
    tag: 7-alpine
  replicas: 1
  port: 6379
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 256Mi

rabbitmq:
  image:
    repository: rabbitmq
    tag: 3.13-management-alpine
  replicas: 1
  ports:
    amqp: 5672
    management: 15672
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

mailhog:
  image:
    repository: mailhog/mailhog
    tag: v1.0.1
  replicas: 1
  ports:
    smtp: 1025
    ui: 8025
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# --- App services -----------------------------------------------------------

shipmentsService:
  image:
    repository: ghcr.io/rostyslavdiachuk/shipments-service
    tag: latest
  replicas: 1
  port: 8000
  config:
    SHIPMENTS_RABBITMQ_EXCHANGE: "parcelpigeon"
    SHIPMENTS_PUBLISH_EVENTS: "true"
    SHIPMENTS_ETA_HOURS: "72"
    SHIPMENTS_LOG_LEVEL: "INFO"
  secret:
    SHIPMENTS_DATABASE_URL: postgresql+psycopg://parcelpigeon:parcelpigeon@postgres:5432/shipments
    SHIPMENTS_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

trackingService:
  image:
    repository: ghcr.io/rostyslavdiachuk/tracking-service
    tag: latest
  replicas: 1
  port: 8002
  config:
    TRACKING_HTTP_ADDR: ":8002"
    TRACKING_REDIS_ADDR: "redis:6379"
    TRACKING_EXCHANGE: "parcelpigeon"
    TRACKING_QUEUE: "tracking.projector"
    TRACKING_SHIPMENTS_URL: "http://shipments-service:8000"
    TRACKING_SMTP_ADDR: "mailhog:1025"
    TRACKING_MAIL_FROM: "no-reply@parcelpigeon.test"
    TRACKING_ENABLE_CONSUMER: "true"
  secret:
    TRACKING_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

gateway:
  image:
    repository: ghcr.io/rostyslavdiachuk/gateway
    tag: latest
  replicas: 1
  port: 8000
  config:
    PORT: "8000"
    HOST: "0.0.0.0"
    SHIPMENTS_URL: "http://shipments-service:8000"
    TRACKING_URL: "http://tracking-service:8002"
    LOG_LEVEL: "info"
  secret:
    GATEWAY_API_KEY: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

web:
  image:
    repository: ghcr.io/rostyslavdiachuk/web
    tag: latest
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
