apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parcelpigeon
  namespace: parcelpigeon
spec:
  ingressClassName: nginx
  rules:
    - host: parcelpigeon.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
